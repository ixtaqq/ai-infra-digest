name: Live API Contracts

on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Yahoo and EDGAR responses
        # These checks read public APIs only. The values satisfy config parsing.
        env:
          TELEGRAM_BOT_TOKEN: contract-check
          TELEGRAM_CHAT_ID: "0"
          AI_API_KEY: contract-check
        run: npm run verify:live-contracts

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping failure notification"
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: *${{ github.workflow }}* failed on \`${{ github.repository }}\` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
