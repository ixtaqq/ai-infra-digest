name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Advisories and upstream APIs change without a push.
    - cron: "19 4 * * 1"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript type check)
        run: npm run lint

      - name: Build production entrypoints
        run: npm run build

      - name: Build production container
        run: docker build --tag goldirham-webhook:ci .

      - name: Verify isolated webhook container
        run: node scripts/verify-container.mjs goldirham-webhook:ci

      - name: Unit tests (no live credentials required)
        run: npm run test:unit

      - name: Full test suite (mocked integration boundaries)
        run: npm test

      - name: Verify responsive website
        run: |
          python3 -m http.server 4321 --directory website >/tmp/website-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/website-server.log
              exit 1
            fi
            sleep 0.5
          done
          BROWSER_PATH=/usr/bin/google-chrome npm run verify:website

      # Blocking dependency-vulnerability gate. Fails only on high/critical
      # advisories (currently 0). Uses the npm CLI directly — no marketplace
      # action to pin, matching this repo's SHA-pinning convention.
      - name: Security audit (dependencies)
        run: npm audit --audit-level=high

      # Blocking static analysis. The configured ERROR-level ruleset was verified
      # clean locally before this gate was made blocking.
      - name: Static analysis (semgrep)
        run: |
          pipx install semgrep
          semgrep scan --config p/security-audit --config p/typescript --severity ERROR --error

      - name: Notify Slack when the scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping failure notification"
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: *${{ github.workflow }}* scheduled run failed on \`${{ github.repository }}\` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>\"}" \
            "$SLACK_WEBHOOK_URL"

  migration-validation:
    name: Supabase migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase database only
        run: npx supabase db start

      - name: Apply migrations without seed data
        run: npx supabase db reset --local --no-seed --yes

      - name: Execute database authorization and delivery tests
        run: npx supabase test db --local

      - name: Verify local HTTP API contracts
        run: |
          npm run build
          npm run verify:local-api

      - name: Verify concurrent delivery and inbox claims
        run: npm run verify:local-concurrency

      - name: Lint local database schema
        run: npx supabase db lint --local --fail-on error

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup
