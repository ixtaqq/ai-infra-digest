name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript type check)
        run: npm run lint

      - name: Unit tests (no live credentials required)
        run: npm run test:unit

      # Blocking dependency-vulnerability gate. Fails only on high/critical
      # advisories (currently 0). Uses the npm CLI directly — no marketplace
      # action to pin, matching this repo's SHA-pinning convention.
      - name: Security audit (dependencies)
        run: npm audit --audit-level=high

      # Static analysis for the prompt-injection / unsanitized-output patterns
      # that pattern-based SAST catches well. Informational for now
      # (continue-on-error) so it never blocks on an un-triaged baseline; flip to
      # blocking (drop continue-on-error, add --error) once findings are reviewed.
      - name: Static analysis (semgrep)
        continue-on-error: true
        run: |
          pipx install semgrep
          semgrep scan --config p/security-audit --config p/typescript --severity ERROR
