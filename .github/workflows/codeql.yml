name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Monday 5:00 AM UTC) catches advisories in code that
    # hasn't changed since the last push.
    - cron: "0 5 * * 1"

permissions:
  actions: read # required by CodeQL analysis to inspect the current workflow run
  contents: read
  security-events: write # required for CodeQL to upload results to the Security tab

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # GitHub CodeQL requires a paid Code Security license for private repos.
    # This workflow becomes active automatically if the repository is public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # Security-focused query pack in addition to the default suite.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
