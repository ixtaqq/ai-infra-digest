name: Daily AI Infrastructure Digest

on:
  schedule:
    # Publish at 06:17 MYT (22:17 UTC), ahead of the 08:00 delivery target.
    # pg_cron dispatches this on time once its Vault token exists; this schedule
    # is a backstop, and a late run reuses the edition without new AI calls.
    - cron: "17 22 * * *"
  workflow_dispatch: # Allow manual trigger for testing

concurrency:
  group: editorial-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Restore digest caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache
            .ai-cache
          key: digest-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            digest-cache-${{ runner.os }}-${{ github.ref_name }}-

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Generate and publish AI Infrastructure Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-oss-120b' }}
          AI_FAST_MODEL: ${{ vars.AI_FAST_MODEL || 'openai/gpt-oss-20b' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER }}
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
          AI_FALLBACK_FAST_MODEL: ${{ vars.AI_FALLBACK_FAST_MODEL }}
          AI_FALLBACK_BASE_URL: ${{ vars.AI_FALLBACK_BASE_URL }}
          OPENAI_EMBEDDING_API_KEY: ${{ secrets.OPENAI_EMBEDDING_API_KEY }}
          ROIC_AI_API_KEY: ${{ secrets.ROIC_AI_API_KEY }}
          AI_BUDGET_DAILY_USD: ${{ vars.AI_BUDGET_DAILY_USD || '0.50' }}
          AI_BUDGET_MONTHLY_USD: ${{ vars.AI_BUDGET_MONTHLY_USD || '5.00' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          TZ: Asia/Kuala_Lumpur
        # `npm ci` above already ran the postinstall script (package.json), which
        # patches node-telegram-bot-api's "exports" field — no separate step needed.
        run: node dist/index.js --publish-only

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping failure notification"
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: *${{ github.workflow }}* failed on \`${{ github.repository }}\` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
