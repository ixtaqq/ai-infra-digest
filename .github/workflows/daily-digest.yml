name: Daily AI Infrastructure Digest

on:
  schedule:
    # 8:00 AM Malaysia Time (UTC+8) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  generate-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ai-infra-digest/package-lock.json

      - name: Install dependencies
        run: |
          cd ai-infra-digest
          npm ci

      - name: Build TypeScript
        run: |
          cd ai-infra-digest
          npm run build

      - name: Generate and send AI Infrastructure Digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          TZ: Asia/Kuala_Lumpur
        run: |
          cd ai-infra-digest
          node dist/index.js
