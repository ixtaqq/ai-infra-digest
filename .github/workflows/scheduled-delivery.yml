name: Scheduled Delivery (Per-User)

on:
  schedule:
    # Every 30 minutes — checks if any user's preferred_time matches now
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: read

jobs:
  deliver-digests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run scheduled delivery
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'groq' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'llama-3.3-70b-versatile' }}
          AI_FAST_MODEL: ${{ vars.AI_FAST_MODEL || 'llama-3.1-8b-instant' }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER }}
          AI_FALLBACK_API_KEY: ${{ secrets.AI_FALLBACK_API_KEY }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL }}
          AI_FALLBACK_FAST_MODEL: ${{ vars.AI_FALLBACK_FAST_MODEL }}
          AI_FALLBACK_BASE_URL: ${{ vars.AI_FALLBACK_BASE_URL }}
          OPENAI_EMBEDDING_API_KEY: ${{ secrets.OPENAI_EMBEDDING_API_KEY }}
          ROIC_AI_API_KEY: ${{ secrets.ROIC_AI_API_KEY }}
          AI_BUDGET_DAILY_USD: ${{ vars.AI_BUDGET_DAILY_USD || '0.50' }}
          AI_BUDGET_MONTHLY_USD: ${{ vars.AI_BUDGET_MONTHLY_USD || '5.00' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Asia/Kuala_Lumpur
        run: node dist/scheduler.js

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping failure notification"
            exit 0
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":warning: *${{ github.workflow }}* failed on \`${{ github.repository }}\` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>\"}" \
            "$SLACK_WEBHOOK_URL"
