<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Infra Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    /* ─── CSS Variables for Theming ── */
    :root {
      --bg: #0a0e17;
      --bg-card: #111827;
      --bg-hover: #1f2937;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --border: #1e293b;
      --accent: #22d3ee;
      --accent2: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bullish: #22c55e;
      --bearish: #ef4444;
      --neutral: #94a3b8;
      --header-bg: rgba(17, 24, 39, 0.8);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --bg-card: #ffffff;
      --bg-hover: #e2e8f0;
      --text: #0f172a;
      --text-dim: #64748b;
      --border: #cbd5e1;
      --header-bg: rgba(255, 255, 255, 0.9);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      min-height: 100vh;
    }

    /* ─── Layout ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
    }
    .header h1 {
      font-size: 20px; font-weight: 700;
      display: flex; align-items: center; gap: 10px;
    }
    .header h1 span { color: var(--accent); }
    .header-controls { display: flex; align-items: center; gap: 16px; }
    .header-controls select, .header-controls button {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-controls select:hover, .header-controls button:hover {
      border-color: var(--accent);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .status-dot.live { background: var(--accent2); animation: pulse 2s infinite; }
    .status-dot.offline { background: var(--text-dim); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .container { max-width: 1440px; margin: 0 auto; padding: 24px; }

    /* ─── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .stat-card .label {
      font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text-dim);
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-size: 28px; font-weight: 700;
      line-height: 1.2;
    }
    .stat-card .sub {
      font-size: 12px; color: var(--text-dim); margin-top: 4px;
    }

    /* ─── Charts Grid ── */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .chart-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .chart-card h3 {
      font-size: 14px; font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-dim);
    }
    .chart-card canvas { max-height: 250px; }

    /* ─── Tables ── */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .table-card h3 {
      font-size: 14px; font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-dim);
    }
    table {
      width: 100%; border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim); font-weight: 600;
      text-transform: uppercase; font-size: 11px;
      letter-spacing: 0.5px;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    tr:hover { background: var(--bg-hover); }
    .ticker {
      font-weight: 700; font-family: monospace;
    }
    .bullish { color: var(--bullish); }
    .bearish { color: var(--bearish); }
    .neutral { color: var(--neutral); }

    /* ─── Pipeline Health ── */
    .feed-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .feed-row:last-child { border: none; }
    .feed-status {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .feed-status.success { background: var(--accent2); }
    .feed-status.failed { background: var(--danger); }

    /* ─── Loading / Empty ── */
    .loading {
      text-align: center; padding: 60px 20px;
      color: var(--text-dim);
    }
    .loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Responsive ── */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .charts-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .header { padding: 12px 16px; }
      .header h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>🚀 <span>AI Infra</span> Dashboard</h1>
    <div class="header-controls">
      <span id="liveIndicator"><span class="status-dot live"></span> Live</span>
      <select id="rangeSelect" onchange="loadDashboard()">
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
      <button onclick="loadDashboard()">🔄 Refresh</button>
    </div>
  </div>

  <div class="container" id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Connecting to Supabase...</p>
    </div>
    <div id="content" style="display:none">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="charts-grid" id="chartsGrid"></div>
      <div class="charts-grid">
        <div class="chart-card"><h3>📈 Stock Mentions (7d)</h3><canvas id="stockChart"></canvas></div>
        <div class="chart-card"><h3>🔬 AI Token Usage</h3><canvas id="tokenChart"></canvas></div>
      </div>
      <div class="table-card"><h3>📰 Latest Articles</h3><div id="articlesTable"><table><thead><tr><th>Title</th><th>Category</th><th>Impact</th><th>Score</th><th>Stocks</th></tr></thead><tbody id="articlesBody"></tbody></table></div></div>
      <div class="table-card"><h3>🔌 Pipeline Health</h3><div id="pipelineHealth"></div></div>
      <div class="table-card"><h3>💰 Capex Announcements</h3><div id="capexTable"><table><thead><tr><th>Company</th><th>Amount</th><th>Category</th><th>Description</th></tr></thead><tbody id="capexBody"></tbody></table></div></div>
    </div>
  </div>

  <script>
    // ─── Supabase Config ──
    const SUPABASE_URL = localStorage.getItem('supabase_url') || '';
    const SUPABASE_ANON_KEY = localStorage.getItem('supabase_anon_key') || '';

    let supabase = null;
    let charts = {};

    // ─── Theme ──
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeBtn').textContent = isDark ? '🌙 Dark' : '☀️ Light';
      // Update chart colors on theme toggle
      Object.values(charts).forEach(c => { if (c) c.destroy(); });
      charts = {};
      loadDashboard();
    }

    // ─── Init Supabase ──
    async function initSupabase() {
      const url = SUPABASE_URL || prompt('Enter Supabase URL (Settings → API):');
      const key = SUPABASE_ANON_KEY || prompt('Enter Supabase anon/public key:');
      if (url && key) {
        localStorage.setItem('supabase_url', url);
        localStorage.setItem('supabase_anon_key', key);
        supabase = supabaseJs.createClient(url, key);
        return true;
      }
      return false;
    }

    // ─── Formatting helpers ──
    function fmtNum(n) { return (n || 0).toLocaleString(); }
    function fmtDate(d) { return new Date(d).toLocaleDateString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' }); }
    function impactClass(i) { return i === 'Bullish' ? 'bullish' : i === 'Bearish' ? 'bearish' : 'neutral'; }
    function impactArrow(i) { return i === 'Bullish' ? '▲' : i === 'Bearish' ? '▼' : '▬'; }

    async function query(table, opts = {}) {
      if (!supabase) return [];
      let q = supabase.from(table).select(opts.select || '*');
      if (opts.order) q = q.order(opts.order, { ascending: opts.ascending ?? false });
      if (opts.limit) q = q.limit(opts.limit);
      if (opts.range) q = q.gte('date', opts.range);
      const { data, error } = await q;
      if (error) console.error(table, error);
      return data || [];
    }

    // ─── Load everything ──
    async function loadDashboard() {
      if (!supabase && !(await initSupabase())) return;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      const days = parseInt(document.getElementById('rangeSelect').value);
      const rangeDate = new Date(Date.now() - days * 86400000).toISOString().split('T')[0];

      try {
        const [digests, sectors, stocks, articles, feeds, capex, metrics] = await Promise.all([
          query('digest_runs', { order: 'run_date', limit: 30 }),
          query('sector_activity', { select: 'date,sector,article_count,avg_impact_score,bullish_count,bearish_count', range: rangeDate }),
          query('stock_mentions', { order: 'mention_count', limit: 10, range: rangeDate }),
          query('articles', { order: 'impact_score', limit: 20 }),
          query('pipeline_health', { order: 'created_at', limit: 50 }),
          query('capex_tracking', { order: 'date', limit: 10 }),
          query('daily_metrics', { order: 'date', limit: 30 }),
        ]);

        renderStats(digests, sectors, metrics);
        renderSectorChart(sectors);
        renderStockChart(stocks);
        renderTokenChart(metrics);
        renderArticles(articles);
        renderPipeline(feeds);
        renderCapex(capex);

        document.getElementById('liveIndicator').innerHTML =
          `<span class="status-dot live"></span> Live — ${new Date().toLocaleTimeString('en-MY', { timeZone: 'Asia/Kuala_Lumpur' })} MYT`;

      } catch (e) {
        console.error('Dashboard error:', e);
        document.getElementById('content').innerHTML =
          `<div class="loading"><p>❌ Error loading data: ${e.message}</p><button onclick="loadDashboard()">Retry</button></div>`;
      }
    }

    // ─── Stats ──
    function renderStats(digests, sectors, metrics) {
      const totalDigests = digests.length;
      const successful = digests.filter(d => d.status === 'success').length;
      const failed = digests.filter(d => d.status === 'failed').length;
      const totalArticles = digests.reduce((s, d) => s + (d.articles_processed || 0), 0);
      const activeSectors = sectors.length;
      const totalTokens = digests.reduce((s, d) => s + (d.total_tokens_used || 0), 0);
      const latest = digests[0];
      const lastRun = latest ? fmtDate(latest.run_date) : '—';

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="label">Digest Runs</div>
          <div class="value">${totalDigests}</div>
          <div class="sub">${successful} success · ${failed} failed</div>
        </div>
        <div class="stat-card">
          <div class="label">Articles Analyzed</div>
          <div class="value">${fmtNum(totalArticles)}</div>
          <div class="sub">Last run: ${lastRun}</div>
        </div>
        <div class="stat-card">
          <div class="label">Sectors Active</div>
          <div class="value">${activeSectors}</div>
          <div class="sub">Out of 10 total sectors</div>
        </div>
        <div class="stat-card">
          <div class="label">Stocks Tracked</div>
          <div class="value">${fmtNum(latest?.total_stocks_tracked || '—')}</div>
          <div class="sub">Mentions tracked per day</div>
        </div>
        <div class="stat-card">
          <div class="label">AI Tokens Used</div>
          <div class="value">${fmtNum(totalTokens)}</div>
          <div class="sub">Est. cost: $${(totalTokens * 0.00000015).toFixed(4)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Pipeline Health</div>
          <div class="value">${((successful / Math.max(totalDigests, 1)) * 100).toFixed(0)}%</div>
          <div class="sub">${failed} failed runs</div>
        </div>
      `;
    }

    // ─── Sector Activity (Bar Chart) ──
    function renderSectorChart(sectors) {
      if (charts.sector) charts.sector.destroy();
      const grouped = {};
      sectors.forEach(s => {
        if (!grouped[s.sector]) grouped[s.sector] = 0;
        grouped[s.sector] += s.article_count || 0;
      });
      const labels = Object.keys(grouped);
      const data = Object.values(grouped);
      if (!labels.length) return;

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const ctx = document.getElementById('sectorChart').getContext('2d');
      charts.sector = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Articles',
            data,
            backgroundColor: ['#22d3ee', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#06b6d4'],
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: isDark ? '#94a3b8' : '#64748b', maxRotation: 45 } },
            y: { ticks: { color: isDark ? '#94a3b8' : '#64748b' }, beginAtZero: true }
          }
        }
      });
    }

    // ─── Stock Mentions ──
    function renderStockChart(stocks) {
      if (charts.stock) charts.stock.destroy();
      const top = stocks.slice(0, 10);
      if (!top.length) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const ctx = document.getElementById('stockChart').getContext('2d');

      // Use price change for color if available, else mention count
      const prices = top.map(s => s.price_change_percent || 0);
      const colors = prices.map(p => p >= 0 ? '#22c55e' : '#ef4444');

      charts.stock = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: top.map(s => s.ticker),
          datasets: [{
            label: 'Price Change %',
            data: prices,
            backgroundColor: colors,
            borderRadius: 4,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                afterLabel: (ctx) => {
                  const s = top[ctx.dataIndex];
                  return `Mentions: ${s.mention_count}\nAvg Sentiment: ${(s.avg_sentiment || 0).toFixed(2)}`;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: isDark ? '#94a3b8' : '#64748b' } },
            y: { ticks: { color: isDark ? '#94a3b8' : '#64748b' }, beginAtZero: true }
          }
        }
      });
    }

    // ─── Token Usage ──
    function renderTokenChart(metrics) {
      if (charts.token) charts.token.destroy();
      const recent = (metrics || []).slice(-14);
      if (!recent.length) return;
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const ctx = document.getElementById('tokenChart').getContext('2d');
      charts.token = new Chart(ctx, {
        type: 'line',
        data: {
          labels: recent.map(m => fmtDate(m.date)),
          datasets: [{
            label: 'Tokens',
            data: recent.map(m => m.total_tokens_used || 0),
            borderColor: '#22d3ee',
            backgroundColor: 'rgba(34, 211, 238, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                afterLabel: (ctx) => {
                  const m = recent[ctx.dataIndex];
                  return `Cost: $${((m.total_tokens_used || 0) * 0.00000015).toFixed(4)}`;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: isDark ? '#94a3b8' : '#64748b', maxTicksLimit: 7 } },
            y: { ticks: { color: isDark ? '#94a3b8' : '#64748b' }, beginAtZero: true }
          }
        }
      });
    }

    // ─── Articles Table ──
    function renderArticles(articles) {
      const tbody = document.getElementById('articlesBody');
      if (!articles.length) { tbody.innerHTML = '<tr><td colspan="5">No articles yet</td></tr>'; return; }
      tbody.innerHTML = articles.slice(0, 20).map(a => `
        <tr>
          <td><a href="${a.url || '#'}" target="_blank" style="color:var(--accent);text-decoration:none">${a.title}</a></td>
          <td>${a.category || '—'}</td>
          <td class="${impactClass(a.impact)}">${impactArrow(a.impact)} ${a.impact || '—'}</td>
          <td>${a.impact_score || '—'}/10</td>
          <td>${(a.affected_stocks || []).join(', ') || '—'}</td>
        </tr>
      `).join('');
    }

    // ─── Pipeline Health ──
    function renderPipeline(feeds) {
      const el = document.getElementById('pipelineHealth');
      if (!feeds.length) { el.innerHTML = '<p style="color:var(--text-dim)">No pipeline data yet — run a digest first</p>'; return; }
      // Group by feed name, show latest status
      const latest = {};
      feeds.forEach(f => {
        if (!latest[f.feed_name] || f.created_at > latest[f.feed_name].created_at) {
          latest[f.feed_name] = f;
        }
      });
      const entries = Object.values(latest);
      const healthy = entries.filter(e => e.status === 'success').length;
      const failing = entries.filter(e => e.status === 'failed').length;

      el.innerHTML = `
        <p style="margin-bottom:12px;font-size:13px;color:var(--text-dim)">
          ${healthy} healthy · ${failing} failing · ${entries.length} total feeds
        </p>
        ${entries.slice(0, 30).map(f => `
          <div class="feed-row">
            <span class="feed-status ${f.status}"></span>
            <span style="flex:1">${f.feed_name}</span>
            <span style="color:var(--text-dim);font-size:12px">${f.articles_fetched || 0} articles</span>
            ${f.status === 'failed' ? `<span style="color:var(--danger);font-size:11px">${f.error_message || ''}</span>` : ''}
          </div>
        `).join('')}
      `;
    }

    // ─── Capex ──
    function renderCapex(capex) {
      const tbody = document.getElementById('capexBody');
      if (!capex.length) { tbody.innerHTML = '<tr><td colspan="4">No capex tracked yet</td></tr>'; return; }
      tbody.innerHTML = capex.map(c => `
        <tr>
          <td><strong>${c.company}</strong></td>
          <td>${c.amount || '—'}</td>
          <td>${c.category || '—'}</td>
          <td>${c.description || ''}</td>
        </tr>
      `).join('');
    }

    // ─── Init ──
    loadDashboard();
    // Auto-refresh every 60s
    setInterval(loadDashboard, 60000);
  </script>
</body>
</html>
